[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delve"
version = "0.1.0"
description = "Provision virtual machines from a YAML spec: delve in before you loft-cli up"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "1ops EU" }]
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
hetzner = ["hcloud>=2.0"]
ovh = ["ovh>=1.1"]
all = ["hcloud>=2.0", "ovh>=1.1"]
dev = ["hcloud>=2.0", "ovh>=1.1", "pytest>=8", "ruff>=0.5", "pyright>=1.1.380"]

[project.scripts]
delve = "delve.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
